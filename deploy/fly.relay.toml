app = "browsermesh-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.relay"

[env]
  PORT = "8788"
  # Fly's proxy sets Fly-Client-IP; without this every client shares the
  # proxy's address and the per-address limits would apply to all of them.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1024
    soft_limit = 800

  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
