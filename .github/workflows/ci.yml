name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Test signaling
        run: npm test --workspace=signaling

      - name: Test relay
        run: npm test --workspace=relay

      - name: Test kernel
        run: npm test --workspace=kernel

  # The servers against the newest published @johnhenry/browsermesh-* packages,
  # not the versions pinned in package-lock.json, so a release of the mesh
  # packages that breaks them shows up here (weekly, and on every pull request).
  latest-mesh-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Use the latest mesh packages
        run: >
          npm install --no-save
          -w signaling -w kernel
          @johnhenry/browsermesh-core@latest
          @johnhenry/browsermesh-pod@latest
          @johnhenry/browsermesh-primitives@latest

      - name: Show versions
        run: npm ls --all 2>/dev/null | grep '@johnhenry/browsermesh' || true

      - name: Test signaling
        run: npm test --workspace=signaling

      - name: Test relay
        run: npm test --workspace=relay

      - name: Test kernel
        run: npm test --workspace=kernel
